        // ǰɸѡ״̬
        let currentFilters = {
            type: 'all'
        };

        // ȡͱǩʽ
        function getTypeClass(type) {
            const typeMap = {
                '': 'bridge',
                '': 'display',
                '': 'proof',
                '': 'deposit',
                '': 'placement',
                'Ӧ˿': 'receivable'
            };
            return typeMap[type] || 'bridge';
        }

        // ȡҵͼ
        function getTypeIcon(type) {
            const iconMap = {
                '': 'fa-exchange-alt',
                '': 'fa-hand-holding-usd',
                '': 'fa-eye',
                '': 'fa-chart-line',
                '': 'fa-plus-circle',
                'Ӧ˿': 'fa-file-invoice-dollar'
            };
            return iconMap[type] || 'fa-briefcase';
        }

        // ȾƬ
        function renderCases(cases) {
            const grid = document.getElementById('casesGrid');
            
            if (cases.length === 0) {
                grid.innerHTML = `
                    <div class="cases-empty">
                        <i class="fas fa-folder-open"></i>
                        <p class="cases-empty-text">޷İ</p>
                    </div>
                `;
                return;
            }
            
            grid.innerHTML = cases.map(caseItem => {
                const typeClass = getTypeClass(caseItem.type);
                // ʹʵͼƬûʹĬͼƬ
                const imagePath = caseItem.image || `images/ҵ/mmexport1773302286026.jpg`;
                return `
                    <article class="case-card-enhanced" data-id="${caseItem.id}" onclick="window.location.href='case-detail.html?id=${caseItem.id}'">
                        <div class="case-card-image">
                            <img src="${imagePath}" alt="${caseItem.title}" loading="lazy">
                            <span class="case-type-tag ${typeClass}">${caseItem.type}</span>
                        </div>
                        <div class="case-card-content">
                            <h3 class="case-card-title">${caseItem.title}</h3>
                            <p class="case-card-summary">${caseItem.summary}</p>
                            <div class="case-card-meta">
                                <div class="case-card-amount">
                                    <span class="case-card-amount-label">ʽģ</span>
                                    <span class="case-card-amount-value">${caseItem.amount}</span>
                                </div>
                                <span class="case-card-btn">
                                    鿴 <i class="fas fa-arrow-right"></i>
                                </span>
                            </div>
                        </div>
                    </article>
                `;
            }).join('');
        }

        // ɸѡ
        function filterCases() {
            const filtered = casesData.filter(caseItem => {
                const typeMatch = currentFilters.type === 'all' || caseItem.type === currentFilters.type;
                return typeMatch;
            });
            renderCases(filtered);
        }

        // ɸѡ¼
        function setupFilters() {
            const typeButtons = document.querySelectorAll('#typeFilter .filter-btn');

            typeButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    typeButtons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilters.type = this.dataset.filter;
                    filterCases();
                });
            });
        }

        // ҳ
        let currentPage = 1;
        const itemsPerPage = 6;
        let filteredCases = [...casesData];

        // Ⱦҳ
        function renderPagination() {
            const totalPages = Math.ceil(filteredCases.length / itemsPerPage);
            const container = document.getElementById('paginationContainer');
            if (!container) return;
            
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }
            
            container.innerHTML = `
                <div style="display: inline-flex; align-items: center; gap: 15px;">
                    <button onclick="changePage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''} 
                        style="padding: 10px 20px; background: ${currentPage <= 1 ? '#ccc' : '#1e3a8a'}; color: white; border: none; border-radius: 4px; cursor: ${currentPage <= 1 ? 'not-allowed' : 'pointer'}; font-size: 14px;">һҳ</button>
                    <span style="font-size: 16px; color: #333;"> ${currentPage} ҳ /  ${totalPages} ҳ</span>
                    <button onclick="changePage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''} 
                        style="padding: 10px 20px; background: ${currentPage >= totalPages ? '#ccc' : '#1e3a8a'}; color: white; border: none; border-radius: 4px; cursor: ${currentPage >= totalPages ? 'not-allowed' : 'pointer'}; font-size: 14px;">һҳ</button>
                </div>
            `;
        }

        // лҳ
        function changePage(newPage) {
            const totalPages = Math.ceil(filteredCases.length / itemsPerPage);
            if (newPage < 1 || newPage > totalPages) return;
            currentPage = newPage;
            renderCasesPage();
            renderPagination();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Ⱦǰҳ
        function renderCasesPage() {
            const grid = document.getElementById('casesGrid');
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageCases = filteredCases.slice(start, end);
            
            if (pageCases.length === 0) {
                grid.innerHTML = `
                    <div class="cases-empty">
                        <i class="fas fa-folder-open"></i>
                        <p class="cases-empty-text">޷İ</p>
                    </div>
                `;
                return;
            }
            
            grid.innerHTML = pageCases.map(caseItem => {
                const typeClass = getTypeClass(caseItem.type);
                const imagePath = caseItem.image || 'images/cases/default.jpg';
                return `
                    <article class="case-card-enhanced" data-id="${caseItem.id}" onclick="window.location.href='case-detail.html?id=${caseItem.id}'">
                        <div class="case-card-image">
                            <img src="${imagePath}" alt="${caseItem.title}" loading="lazy">
                            <span class="case-type-tag ${typeClass}">${caseItem.type}</span>
                        </div>
                        <div class="case-card-content">
                            <h3 class="case-card-title">${caseItem.title}</h3>
                            <p class="case-card-summary">${caseItem.summary}</p>
                            <div class="case-card-meta">
                                <div class="case-card-amount">
                                    <span class="case-card-amount-label">ʽģ</span>
                                    <span class="case-card-amount-value">${caseItem.amount}</span>
                                </div>
                                <span class="case-card-btn">鿴 <i class="fas fa-arrow-right"></i></span>
                            </div>
                        </div>
                    </article>
                `;
            }).join('');
        }

        // ɸѡ
        function filterCases() {
            currentPage = 1;
            filteredCases = casesData.filter(caseItem => {
                return currentFilters.type === 'all' || caseItem.type === currentFilters.type;
            });
            renderCasesPage();
            renderPagination();
        }

        // ʼ
        document.addEventListener('DOMContentLoaded', function() {
            filteredCases = [...casesData];
            renderCasesPage();
            renderPagination();
            setupFilters();
        });
    </script>
