<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试图片上传</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .upload-area:hover {
            border-color: #3b82f6;
            background: #f0f7ff;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        .result.success {
            background: #d1fae5;
            color: #065f46;
            display: block;
        }
        .result.error {
            background: #fee2e2;
            color: #991b1b;
            display: block;
        }
        .preview {
            margin-top: 20px;
            max-width: 100%;
        }
        .preview img {
            max-width: 100%;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>图片上传测试</h1>
    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        <p>点击选择图片上传</p>
        <p style="color: #999; font-size: 14px;">支持 JPG, PNG, GIF, WebP 格式，最大 5MB</p>
    </div>
    <input type="file" id="fileInput" accept="image/*" style="display: none;">
    
    <div id="result" class="result"></div>
    <div id="preview" class="preview"></div>

    <script>
        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const resultDiv = document.getElementById('result');
            const previewDiv = document.getElementById('preview');
            
            resultDiv.className = 'result';
            resultDiv.textContent = '上传中...';
            resultDiv.style.display = 'block';
            previewDiv.innerHTML = '';

            const formData = new FormData();
            formData.append('image', file);

            try {
                const response = await fetch('http://localhost:3000/api/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <strong>上传成功!</strong><br>
                        URL: ${data.data.url}<br>
                        文件名: ${data.data.filename}<br>
                        大小: ${(data.data.size / 1024).toFixed(2)} KB
                    `;
                    previewDiv.innerHTML = `<img src="${data.data.url}" alt="上传的图片">`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = '上传失败: ' + data.message;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = '上传错误: ' + error.message;
            }
        });
    </script>
</body>
</html>
