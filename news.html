    <script>
    (function(){
        var xhr=new XMLHttpRequest();
        xhr.open('GET','admin/api/fetch-logo.php?t='+Date.now(),true);
        xhr.onload=function(){
            if(xhr.status>=200&&xhr.status<400){
                try{
                    var resp=JSON.parse(xhr.responseText);
                    if(resp.code===0&&resp.data){
                        if(resp.data.header_logo){
                            var hl=document.querySelector('.logo img');
                            if(hl)hl.src=resp.data.header_logo;
                        }
                        if(resp.data.footer_logo){
                            var fl=document.querySelector('.footer-logo img');
                            if(fl)fl.src=resp.data.footer_logo;
                        }
                        if(resp.data.favicon){
                            var lk=document.querySelector('link[rel="icon"]')||document.querySelector('link[rel="shortcut icon"]');
                            if(!lk){lk=document.createElement('link');lk.rel='icon';document.head.appendChild(lk);}
                            lk.href=resp.data.favicon;
                        }
                    }
                }catch(e){}
            }
        };
        xhr.send();
    })();
    </script>

    <!-- 动态加载资讯文章 -->
    <script>
        // 当前选中的分类
        let currentCategoryId = 0;
        let currentPage = 1;
        const pageSize = 10;
        
        // 从服务器API加载分类
        async function loadCategories() {
            console.log('[News] 开始加载分类...');
            
            const categoriesContainer = document.getElementById('newsCategories');
            if (!categoriesContainer) {
                console.error('[News] 找不到分类容器');
                return;
            }
            
            // 保留"全部资讯"，移除其他分类
            const allLink = categoriesContainer.querySelector('[data-cat-id="0"]');
            categoriesContainer.innerHTML = '';
            if (allLink) {
                allLink.addEventListener('click', async function(e) {
                    e.preventDefault();
                    currentCategoryId = 0;
                    updateActiveCategory();
                    const serverArticles = await loadNewsFromServer();
                    if (serverArticles && serverArticles.length > 0) {
                        renderArticles(serverArticles);
                    } else {
                        console.log("[News] API请求完成，无文章数据");
                    }
                });
                categoriesContainer.appendChild(allLink);
            }
            
            // 从服务器获取分类
            let categories = [];
            try {
                const resp = await fetch('api/categories.php?type=news&t=' + Date.now(), {
                    cache: 'no-store'
                });
                if (resp.ok) {
                    const result = await resp.json();
                    if (result.success && result.categories) {
                        categories = result.categories;
                    }
                }
            } catch(e) {
                console.warn('[News] 分类API加载失败:', e);
            }
            
            if (categories.length > 0) {
                categories.forEach(cat => {
                    const catLink = document.createElement('a');
                    catLink.href = '#';
                    catLink.className = 'news-category';
                    catLink.textContent = cat.name;
                    catLink.dataset.catId = cat.id;
                    catLink.addEventListener('click', async function(e) {
                        e.preventDefault();
                        currentCategoryId = cat.id;
                        updateActiveCategory();
                        const serverArticles = await loadNewsFromServer();
                        if (serverArticles && serverArticles.length > 0) {
                            renderArticles(serverArticles);
                        } else {
                            console.log("[News] API请求完成，无文章数据");
                        }
                    });
                    categoriesContainer.appendChild(catLink);
                });
            } else {
                console.warn('[News] 没有从API加载到分类');
            }
            
            console.log('[News] 分类加载完成');
        }
        
        // 更新活跃分类样式
        function updateActiveCategory() {
            document.querySelectorAll('.news-category').forEach(cat => {
                cat.classList.remove('active');
                if (parseInt(cat.dataset.catId) === currentCategoryId) {
                    cat.classList.add('active');
                }
            });
        }
        
        // 从服务器API加载文章
        async function loadNewsFromServer() {
            console.log('[News] 开始从服务器加载文章...');

            try {
                const apiUrl = currentCategoryId
                    ? `api/news.php?category_id=${currentCategoryId}&page=${currentPage}&limit=${pageSize}&t=${Date.now()}`
                    : `api/news.php?page=${currentPage}&limit=${pageSize}&t=${Date.now()}`;

                const response = await fetch(apiUrl, {
                    method: 'GET',
                    cache: 'no-store',
                    headers: {
                        'Accept': 'application/json',
                        'Cache-Control': 'no-cache'
                    }
                });

                if (!response.ok) {
                    console.error('[News] API响应错误:', response.status);
                    return null;
                }

                const result = await response.json();
                console.log('[News] API返回:', result);

                if (result.success) {
                    // 兼容两种响应格式：result.data.news 或 result.news
                    const articles = result.data ? result.data.news : result.news;
                    const total = result.data ? result.data.total : result.total;
                    const totalPages = result.data ? result.data.totalPages : result.totalPages;
                    if (articles) {
                        console.log('[News] 从服务器加载了', articles.length, '篇文章，共', totalPages, '页');
                        renderPagination(totalPages, currentPage);
                        return articles;
                    }
                }

                return null;
            } catch (error) {
                console.error('[News] 从服务器加载失败:', error);
                return null;
            }
        }

        // localStorage备用逻辑已清除，只从API读取
        console.log("[News] localStorage已禁用，只从API读取");
        function isValidImage(imageData) {
            if (!imageData) return false;
            if (typeof imageData !== 'string') return false;
            // 检查是否是有效的Base64图片
            if (imageData.startsWith('data:image')) {
                // 检查Base64数据是否完整（至少要有头部和一部分数据）
                return imageData.length > 100;
            }
            // 检查是否是有效的URL
            if (imageData.startsWith('http://') || imageData.startsWith('https://') || imageData.startsWith('/')) {
                return imageData.length > 10;
            }
            // 检查是否是相对路径（uploads/ 或 images/）
            if (imageData.startsWith('uploads/') || imageData.startsWith('images/')) {
                return true;
            }
            return false;
        }

        // 获取有效的封面图片
        function getValidCoverImage(article) {
            // 如果有封面图，使用封面图
            if (article.cover_image && isValidImage(article.cover_image)) {
                return article.cover_image;
            }
            // 如果没有封面图，返回 null（显示空白占位图）
            return null;
        }

        // 获取网站根目录路径
        function getBasePath() {
            const path = window.location.pathname;
            const match = path.match(/^\/[^\/]+/);
            return match ? match[0] : '';
        }

        // 创建文章卡片HTML
        function createNewsCard(article) {
            const title = article.title || '无标题';
            const summary = article.summary || article.content?.replace(/<[^>]*>/g, '').substring(0, 100) + '...' || '';
            const date = article.publishDate || article.publish_date || article.created_at || new Date().toISOString();
            const formattedDate = new Date(date).toLocaleDateString('zh-CN');
            const coverImage = getValidCoverImage(article);
            const articleId = article.id;
            const basePath = getBasePath();

            console.log('[News] 渲染文章卡片:', { title, articleId, date, hasCover: !!coverImage });
            
            // 封面图片路径由API直接提供，已包含完整路径（如 /hongdu/uploads/xxx.jpg）
            const imgSrc = coverImage || '';
            
            // 根据是否有封面图生成不同的HTML
            const imageHtml = imgSrc 
                ? `<div class="news-thumb"><img src="${imgSrc}" alt="${title}" loading="lazy"></div>`
                : `<div class="news-thumb placeholder"><div class="placeholder-bg"></div></div>`;
            
            return `
                <article class="news-card">
                    ${imageHtml}
                    <div class="news-content">
                        <h3><a href="news-detail.php?id=${articleId}">${title}</a></h3>
                        <p class="news-excerpt">${summary}</p>
                        <div class="news-footer">
                            <a href="news-detail.php?id=${articleId}" class="news-more">查看更多 →</a>
                            <time class="news-date">${formattedDate}</time>
                        </div>
                    </div>
                </article>
            `;
        }
        
        // 渲染文章列表
        function renderArticles(articles) {
            console.log('[News] 开始渲染文章，共', articles.length, '篇');

            const newsContainer = document.querySelector('.news-list-container');
            if (!newsContainer) {
                console.error('[News] 找不到文章列表容器');
                return;
            }

            if (articles.length === 0) {
                newsContainer.innerHTML = '<div class="news-empty"><p>该分类下暂无文章</p></div>';
                return;
            }

            // 清空现有内容
            newsContainer.innerHTML = '';

            // 添加每篇文章
            articles.forEach(article => {
                const articleHtml = createNewsCard(article);
                newsContainer.insertAdjacentHTML('beforeend', articleHtml);
            });

            console.log('[News] 文章渲染完成');
        }

        // 渲染分页
        function renderPagination(totalPages, currentPage) {
            const paginationContainer = document.querySelector('.news-pagination');
            if (!paginationContainer || totalPages <= 1) {
                if (paginationContainer) paginationContainer.innerHTML = '';
                return;
            }

            let html = '';
            // 上一页按钮
            html += `<a href="#" class="pagination-btn ${currentPage === 1 ? 'disabled' : ''}" onclick="goToPage(${currentPage - 1}); return false;"><i class="fas fa-chevron-left"></i></a>`;
            
            // 页码按钮
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    html += `<a href="#" class="pagination-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i}); return false;">${i}</a>`;
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    html += `<span class="pagination-btn disabled">...</span>`;
                }
            }
            
            // 下一页按钮
            html += `<a href="#" class="pagination-btn ${currentPage === totalPages ? 'disabled' : ''}" onclick="goToPage(${currentPage + 1}); return false;"><i class="fas fa-chevron-right"></i></a>`;
            
            paginationContainer.innerHTML = html;
        }

        // 跳转到指定页
        async function goToPage(page) {
            currentPage = page;
            const serverArticles = await loadNewsFromServer();
            if (serverArticles && serverArticles.length > 0) {
                renderArticles(serverArticles);
            }
        }

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', async function() {
            loadCategories();

                        // 从API加载文章数据（仅API，无localStorage回退）
            console.log('[News] 尝试从API加载文章...');
            const serverArticles = await loadNewsFromServer();

            if (serverArticles && serverArticles.length > 0) {
                console.log('[News] API加载成功，共', serverArticles.length, '篇文章');
                renderArticles(serverArticles);
            } else {
                console.log('[News] API加载失败或无数据');
            }
        });
    </script>

<script>
                // 动态加载导航菜单 — 优先从数据库，回退localStorage
                (function() {
                    var defaultNavItems = [
                        { id: '1', name: '首页', url: 'index.html', icon: 'fas fa-home' },
                        { id: '2', name: '业务范围', url: 'services.html', icon: 'fas fa-briefcase' },
                        { id: '3', name: '成功案例', url: 'cases.html', icon: 'fas fa-trophy' },
                        { id: '4', name: '服务优势', url: 'advantages.html', icon: 'fas fa-star' },
                        { id: '5', name: '行业资讯', url: 'news.html', icon: 'fas fa-newspaper' },
                        { id: '6', name: '常见问题', url: 'faq.html', icon: 'fas fa-question-circle' },
                        { id: '7', name: '联系我们', url: 'contact.html', icon: 'fas fa-phone' }
                    ];

                    function renderNav(items) {
                        var container = document.getElementById('dynamicNavMenu');
                        if (!container) return;
                        var current = window.location.pathname.split('/').pop() || 'index.html';
                        var html = '';
                        for (var i = 0; i < items.length; i++) {
                            var item = items[i];
                            var active = item.url === current || (current === '' && item.url === 'index.html');
                            html += '<li role="none"><a href="' + item.url + '" class="nav-link' + (active ? ' active' : '') + '" role="menuitem">' + item.name + '</a></li>';
                        }
                        container.innerHTML = html;
                        try { localStorage.setItem('cms_nav_items', JSON.stringify(items)); } catch(e) {}
                    }

                    function fallback() {
                        try {
                            var stored = localStorage.getItem('cms_nav_items');
                            if (stored) {
                                var parsed = JSON.parse(stored);
                                if (Array.isArray(parsed) && parsed.length > 0) { renderNav(parsed); return; }
                            }
                        } catch(e) {}
                        renderNav(defaultNavItems);
                    }

                    var xhr = new XMLHttpRequest();
                    xhr.open('GET', 'admin/api/nav-save.php?type=nav&t=' + Date.now(), true);
                    xhr.onload = function() {
                        if (xhr.status >= 200 && xhr.status < 400) {
                            try {
                                var resp = JSON.parse(xhr.responseText);
                                if (resp.code === 0 && resp.data && resp.data.length > 0) { renderNav(resp.data); return; }
